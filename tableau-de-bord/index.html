<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<title>BOD · Tableau de bord</title>
<link rel="icon" type="image/png" href="/tableau-de-bord/icones/icone-192.png"/>
<!-- Icône et nom quand on l'ajoute à l'écran d'accueil du téléphone (14/10/2026) -->
<link rel="apple-touch-icon" href="/tableau-de-bord/icones/apple-touch-icon.png?v=3"/>
<link rel="manifest" href="/tableau-de-bord/manifest.json"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="BOD"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#FBF9F8"/>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<!-- Tableau de bord privé de Jules (14/10/2026). Mise en page choisie : « A · planète au centre ».
     V3 : menu du haut = Aujourd'hui / Cette semaine / Ce mois / Cette année / Toutes les années ;
     accueil = planète + l'essentiel ; menu ☰ = autres pages (Bornes, Alertes, Horaires, Rentabilité, Batteries & cautions ; Prospects retirés le 16/10/2026) ;
     clic sur une borne = petit résumé sur la carte, 2e clic = page complète de la borne.
     Couleurs : rouge = borne éteinte / en panne, orange = batterie(s) non rendue(s) depuis plus de 24 h, vert sinon.
     DONNÉES D'EXEMPLE pour l'instant (aucune borne installée).
     Plus tard : bornes depuis Airtable, encaissements depuis Stripe, état des bornes depuis la plateforme du fabricant. -->
<style>
@font-face{font-family:"Plus Jakarta Sans";font-weight:200 800;font-display:swap;src:url(/fonts/plus-jakarta-sans-latin.woff2) format("woff2")}
:root{--fond:#FBF9F8;--fond2:#ffffff;--carte:rgba(255,255,255,.88);--plein:#ffffff;--trait:rgba(27,28,28,.08);--texte:#1B1C1C;--doux:rgba(27,28,28,.62);--pale:rgba(27,28,28,.42);--leger:rgba(27,28,28,.05);--lime:#D0FF00;--vert:#4F7A00;--orange:#F28C28;--rouge:#E5484D;--bleu:#3B9EDB;--ombre:0 14px 34px -20px rgba(27,28,28,.28);--r:22px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fond);color:var(--texte);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#globe{position:fixed;inset:0}
.maplibregl-ctrl-attrib{background:rgba(255,255,255,.75)!important;color:var(--pale)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--pale)!important}
.verre{background:var(--carte);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--trait);border-radius:var(--r);box-shadow:var(--ombre)}
.etiq{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pale)}
.num{font-variant-numeric:tabular-nums}
.plus{color:var(--vert)}.moins{color:var(--rouge)}
/* ---------- Barre du haut : logo · périodes · menu ---------- */
.haut{position:fixed;top:14px;left:16px;right:16px;display:flex;align-items:center;gap:12px;z-index:20}
.logo{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border:0;background:var(--carte)}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:12px;color:var(--doux);font-weight:600;border-left:1px solid var(--trait);padding-left:10px}
.periodes{display:flex;padding:4px;gap:2px;margin:0 auto}
.periodes button{border:0;background:transparent;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--doux);white-space:nowrap;transition:background .2s,color .2s}
.periodes button:hover{color:var(--texte)}
.periodes button[aria-pressed="true"]{background:var(--lime);color:var(--texte)}
.burger{display:flex;align-items:center;gap:8px;padding:11px 16px;font-size:13px;font-weight:700;border:1px solid var(--trait)}
.burger svg{width:18px;height:18px}
/* ---------- Menu des autres pages ---------- */
.voile{position:fixed;inset:0;background:rgba(27,28,28,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.voile.on{opacity:1;pointer-events:auto}
.tiroir{position:fixed;top:0;right:0;bottom:0;width:320px;max-width:86vw;background:var(--fond2);border-left:1px solid var(--trait);z-index:41;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:22px 16px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.tiroir.on{transform:none}
.tiroir .etiq{padding:6px 12px 10px}
.tiroir a{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;color:var(--texte);text-decoration:none;font-weight:700;font-size:15px}
.tiroir a:hover{background:var(--leger)}
.tiroir a.actif{background:var(--lime);color:var(--texte)}
.tiroir a.actif .ico{background:rgba(27,28,28,.1)}
.tiroir a small{margin-left:auto;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--leger);color:var(--doux)}
.tiroir a small.chaud{background:var(--rouge);color:#fff}
.tiroir .ico{width:34px;height:34px;border-radius:10px;background:var(--leger);display:grid;place-items:center;font-size:16px;flex:none}
/* ---------- Accueil : colonnes flottantes ---------- */
.gauche{position:fixed;left:16px;top:84px;width:360px;display:flex;flex-direction:column;gap:12px;z-index:4;max-height:calc(100% - 100px);overflow:auto;scrollbar-width:none}
.gauche::-webkit-scrollbar{display:none}
.bloc{padding:18px}
.gros{font-size:46px;font-weight:800;letter-spacing:-.045em;line-height:1;margin:10px 0 8px}
.ecart{font-size:12.5px;font-weight:700}
.ecart small{color:var(--pale);font-weight:600;font-size:12px}
.barres{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:14px}
.barres i{flex:1;background:rgba(27,28,28,.14);border-radius:3px 3px 1px 1px;min-height:2px;transition:height .4s cubic-bezier(.2,.8,.2,1)}
.barres i.der{background:var(--lime);box-shadow:inset 0 0 0 1px rgba(27,28,28,.12)}
.barres.haute{height:140px}
.axe{display:flex;justify-content:space-between;font-size:10px;color:var(--pale);margin-top:6px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo>div{padding:16px}
.duo b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.duo .sous{font-size:12px;color:var(--doux);font-weight:600;margin-top:6px;line-height:1.55}
.pastille{display:inline-flex;align-items:center;gap:6px}
.pastille i{width:7px;height:7px;border-radius:50%}
.pt,.pastille i,.legende i,.etat i{box-shadow:inset 0 0 0 1px rgba(27,28,28,.22)}
.alerte{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border:0;border-top:1px solid var(--trait);font-size:13px;width:100%;background:none;text-align:left}
.alerte:first-child{border-top:0}
.alerte .pt{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:none}
.alerte b{display:block;font-weight:700}
.alerte span{color:var(--doux);font-size:12px}
.lien{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--vert);text-decoration:none;background:none;border:0;padding:0}
.droite{position:fixed;right:16px;top:84px;width:350px;max-height:calc(100% - 100px);display:flex;flex-direction:column;z-index:4;overflow:hidden}
.droite .tete{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
.liste{overflow:auto;padding:0 10px 10px;scrollbar-width:thin}
.ligne{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:11px 10px;border-radius:14px;transition:background .15s}
.ligne:hover{background:var(--leger)}
.ligne .pt{width:9px;height:9px;border-radius:50%;flex:none}
.ligne .nom{flex:1;min-width:0}
.ligne .nom b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne .nom span{font-size:12px;color:var(--doux)}
.ligne .eur{font-weight:800;font-size:14px;text-align:right}
.ligne .eur small{display:block;font-size:11px;color:var(--pale);font-weight:600}
.legende{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:16px;padding:10px 16px;font-size:12px;color:var(--doux);z-index:4;white-space:nowrap}
.legende span{display:flex;align-items:center;gap:6px}
.legende i{width:8px;height:8px;border-radius:50%}
/* ---------- Repères et petit résumé sur la carte ---------- */
.pin{width:16px;height:16px;border-radius:50%;border:2px solid #1B1C1C;cursor:pointer;animation:pouls 2.4s infinite}
.pin.sel{width:24px;height:24px;border:3px solid #1B1C1C;outline:3px solid #fff}
@keyframes pouls{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 60%,transparent)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
.maplibregl-popup-content{background:var(--plein)!important;color:var(--texte);border:1px solid var(--trait);border-radius:18px!important;padding:16px!important;box-shadow:0 24px 60px -24px rgba(27,28,28,.35)!important;font-family:inherit;width:270px}
.maplibregl-popup-content,.maplibregl-popup-content button{font-family:"Plus Jakarta Sans",system-ui,sans-serif!important}
.maplibregl-popup-tip{border-top-color:var(--plein)!important;border-bottom-color:var(--plein)!important}
.bulle h3{margin:0;font-size:17px;letter-spacing:-.02em}
.bulle .s{font-size:12px;color:var(--doux);margin-top:2px}
.bulle .etat{margin-top:10px}
.bulle .kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.bulle .kpi div{background:var(--leger);border-radius:10px;padding:8px}
.bulle .kpi b{display:block;font-size:15px;font-weight:800}
.bulle .kpi span{font-size:10.5px;color:var(--doux);font-weight:600}
.bulle p{font-size:12px;color:var(--doux);margin:10px 0 0;line-height:1.5}
.bulle p b{color:var(--texte)}
.bulle .ouvrir{margin-top:12px;width:100%;border:0;background:var(--lime);color:var(--texte);font-weight:800;font-size:13px;padding:10px;border-radius:12px}
.bulle .astuce{display:block;text-align:center;font-size:10.5px;color:var(--pale);margin-top:6px}
.etat{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--leger)}
.etat i{width:8px;height:8px;border-radius:50%}
/* ---------- Pages pleines (menu ☰ et page d'une borne) ---------- */
.page{position:fixed;inset:0;background:var(--fond);z-index:10;overflow:auto;padding:96px 24px 60px;display:none}
.page.on{display:block}
.page .cadre{max-width:1120px;margin:0 auto}
.page h1{font-size:clamp(30px,4vw,44px);letter-spacing:-.04em;margin:6px 0 4px}
.page .chapo{color:var(--doux);font-size:14px;margin:0 0 22px;line-height:1.5}
.retourp{border:0;background:var(--leger);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--doux)}
.cartes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.carte{background:var(--plein);border:1px solid var(--trait);border-radius:var(--r);padding:18px}
.carte b.v{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.carte .sous{font-size:12px;color:var(--doux);margin-top:4px;font-weight:600}
.deux{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
.filtres{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filtres button{border:1px solid var(--trait);background:transparent;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--doux)}
.filtres button[aria-pressed="true"]{background:var(--texte);color:#fff;border-color:var(--texte)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pale);padding:10px 12px;border-bottom:1px solid var(--trait);white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid var(--trait);white-space:nowrap}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--leger)}
td.d,th.d{text-align:right}
.tablo{background:var(--plein);border:1px solid var(--trait);border-radius:var(--r);overflow:auto}
.jauge{height:8px;background:rgba(27,28,28,.08);border-radius:99px;overflow:hidden;min-width:90px}
.jauge i{display:block;height:100%;background:var(--lime);border-radius:99px}
.chaleur{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:3px;margin-top:12px;align-items:center}
.chaleur span{font-size:10px;color:var(--pale);font-weight:700}
.chaleur i{display:block;aspect-ratio:1/1.1;border-radius:3px;background:var(--leger)}
.chaleur .h{font-size:9.5px;text-align:left;color:var(--pale);white-space:nowrap;overflow:visible}
.meilleur{margin-top:12px;font-size:13px;line-height:1.6;color:var(--doux)}
.meilleur b{color:var(--texte)}
.slots{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.slots i{width:20px;height:30px;border-radius:6px;background:rgba(27,28,28,.06);border:1.5px solid transparent}
.slots i.on{background:var(--lime);border-color:rgba(27,28,28,.16)}
.slots i.loc{background:transparent;border-color:rgba(27,28,28,.35)}
.slots i.retard{background:var(--orange)}
.cles{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--doux);margin-top:10px}
.cles span{display:flex;align-items:center;gap:5px}
.cles i{width:9px;height:12px;border-radius:3px}
.retards{margin-top:12px;border-radius:14px;background:rgba(255,159,67,.1);border:1px solid rgba(255,159,67,.3);padding:10px 14px;font-size:13px}
.retards div{display:flex;justify-content:space-between;gap:8px;padding:5px 0}
.retards b{color:#B85A00}
.retards div>span:first-child{white-space:nowrap}
.retards div>span:last-child{text-align:right}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kanban .col{background:var(--plein);border:1px solid var(--trait);border-radius:var(--r);padding:14px}
.kanban .fic{background:#F6F3F2;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px}
.kanban .fic span{display:block;font-size:11.5px;color:var(--doux)}
.histo div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--trait);font-size:13px}
.histo div:first-child{border-top:0}
.histo span{color:var(--doux)}
/* 16/10/2026 : CA sans graphique (on touche pour le voir) ; carte « Bornes installées » cliquable ; page Bornes avec carte */
.ca-bloc{cursor:pointer}
.ca-graphe{display:none}
.ca-bloc.ouvert .ca-graphe{display:block}
.ca-astuce{margin-top:10px;font-size:12px;font-weight:700;color:var(--vert)}
.bornes-c{cursor:pointer}
.bornes-c a{color:inherit;text-decoration:none}
.bornes-c a:hover{text-decoration:underline}
.fpt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;box-shadow:inset 0 0 0 1px rgba(27,28,28,.22)}
.filtres button{display:inline-flex;align-items:center}
.bornes-vue{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.carte-bornes{height:520px;border-radius:var(--r);overflow:hidden;border:1px solid var(--trait);background:#efedea}
.liste-bornes{background:var(--plein);border:1px solid var(--trait);border-radius:var(--r);padding:6px;max-height:520px;overflow:auto}
.lb{display:flex;align-items:flex-start;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:14px}
.lb:hover{background:var(--leger)}
.lb .pt{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(27,28,28,.22)}
.lb span{flex:1;min-width:0}
.lb b{display:block;font-size:14.5px}
.lb small{display:block;font-size:12.5px;color:var(--doux);margin-top:2px}
.lb em{display:block;font-style:normal;font-size:12px;font-weight:700;margin-top:4px}
.lb strong{text-align:right;font-size:14px;white-space:nowrap}
.lb strong small{font-weight:600;color:var(--pale);font-size:11px}
.vide{padding:20px;color:var(--doux)}
.pin2{display:flex;align-items:center;gap:6px;cursor:pointer}
.pin2::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid #1B1C1C;flex:none}
.pin2 span{font-size:11.5px;font-weight:800;color:#1B1C1C;background:rgba(255,255,255,.92);padding:3px 8px;border-radius:8px;box-shadow:0 4px 10px -4px rgba(27,28,28,.3);white-space:nowrap}
/* ---------- Téléphone ---------- */
@media (max-width:1000px){
  html,body{overflow:visible;height:auto}
  /* En-tête comme un site : logo + menu en haut, périodes en dessous.
     En descendant, la ligne du logo s'en va et les périodes restent collées en haut, en transparent ; en remontant, le logo revient. */
  #globe{position:relative;height:56vh;inset:auto;margin-top:var(--haut-h,116px)}
  .haut{position:fixed;top:0;left:0;right:0;flex-wrap:wrap;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--fond);border-bottom:1px solid var(--trait);transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s}
  body.replie .haut{transform:translateY(calc(-1 * var(--replie,52px)));background:transparent;border-color:transparent}
  body.replie .periodes{background:rgba(255,255,255,.72)}
  .logo{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:6px 4px}
  .logo span{display:none}
  .burger{margin-left:auto;padding:9px 12px}
  .burger span{display:none}
  .periodes{order:3;width:100%;margin:0;overflow-x:auto;scrollbar-width:none;justify-content:space-between}
  .periodes::-webkit-scrollbar{display:none}
  .periodes button{padding:9px 10px;font-size:12px;flex:1 1 auto}
  .periodes .pc{display:none}
  .periodes button::first-letter{text-transform:uppercase}
  .gauche,.droite{position:static;width:auto;max-height:none;margin:12px}
  .gauche{margin-top:-36px;position:relative;left:auto;top:auto}
  .droite{overflow:visible}
  .legende{display:none}
  .page{position:fixed;padding:calc(var(--haut-h,116px) + 16px) 14px 40px}
  .deux,.kanban,.bornes-vue{grid-template-columns:1fr}
  .carte-bornes{height:340px}
  .liste-bornes{max-height:none}
  .maplibregl-popup-content{width:240px}
}
/* Écran moyen (tablette, petite fenêtre) : les périodes tiennent sur la même ligne, centrées entre le logo et le menu ☰.
   En descendant, le logo et le ☰ s'effacent, les périodes restent en haut en transparent. */
@media (min-width:700px) and (max-width:1000px){
  .haut{flex-wrap:nowrap}
  .periodes{order:2;width:auto;margin:0 auto}
  .burger{order:3;margin-left:0}
  body.replie .haut{transform:none}
  .logo,.burger{transition:opacity .25s,transform .3s}
  body.replie .logo,body.replie .burger{opacity:0;transform:translateY(-16px);pointer-events:none}
}
</style>
</head>
<body>
<div id="globe" aria-label="Planète avec les bornes BOD"></div>

<header class="haut">
  <a class="logo verre" href="#accueil" style="text-decoration:none;color:inherit"><img src="/images/logo-bod.png" alt="bod"/><span>Tableau de bord</span></a>
  <nav class="periodes verre" aria-label="Période" id="periodes"></nav>
  <button class="burger verre" id="burger" aria-label="Ouvrir le menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
</header>

<div class="voile" id="voile"></div>
<nav class="tiroir" id="tiroir" aria-label="Pages du tableau de bord"></nav>

<main id="accueil-vue">
  <aside class="gauche">
    <section class="bloc verre ca-bloc" id="ca-bloc" role="button" tabindex="0" aria-expanded="false" title="Voir l'évolution">
      <div class="etiq" id="t-ca">Chiffre d'affaires</div>
      <div class="gros num" id="ca">—</div>
      <div class="ecart" id="ecart"></div>
      <div class="ca-graphe"><div class="barres" id="barres"></div><div class="axe" id="axe"></div></div>
      <div class="ca-astuce" id="ca-astuce">Voir l'évolution ↓</div>
    </section>
    <section class="duo">

/* ===================== CALCULS ===================== */

}
